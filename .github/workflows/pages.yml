# Version de test du site sur GitHub Pages : https://clementthirot.github.io/brunette-paris/
# La production reste sur Vercel. Ce workflow construit une variante 100 % statique (DEPLOY_TARGET=pages :
# sans adaptateur Vercel ni administration Keystatic), servie sous /brunette-paris et en noindex.
# Prérequis (une fois) : Settings > Pages > Build and deployment > Source = « GitHub Actions ».
name: Version de test (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: pages
      SITE_URL: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}
      SEO_INDEX: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

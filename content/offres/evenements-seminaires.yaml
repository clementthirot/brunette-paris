faq:
  title: Questions fréquentes
  items:
    - question: Combien de participants ?
      answer: >-
        L’atelier s’adapte à la taille de votre événement. En atelier découverte, nous travaillons en petits
        groupes pour que chacun ait le temps d’apprendre le geste. En bar à ceintures ou en marquage libre, les
        invités se succèdent tout au long de la soirée. [À CONFIRMER : taille de groupe idéale et capacité
        maximale par session]
    - question: Quelle durée ?
      answer: >-
        Comptez quelques minutes par invité pour un porte-clés ou un marquage, un peu plus pour une ceinture, et
        une session plus longue pour un atelier découverte. Nous calons le format sur votre programme.
        [À CONFIRMER : durées types par format]
    - question: Quel espace prévoir ?
      answer: >-
        Un espace de quelques mètres carrés, une ou deux tables et une prise électrique pour le fer à marquer
        suffisent. L’atelier s’installe aussi bien dans une salle de séminaire que dans un hôtel, un showroom ou
        sur un stand. [À CONFIRMER : surface et mobilier exacts]
    - question: Peut-on ajouter le logo de l'entreprise ?
      answer: >-
        Oui. Nous faisons réaliser un fer à votre logo pour le marquer à chaud ou en dorure, à côté du prénom de
        chaque invité. Comme pour toutes nos pièces, le marquage se fait dans la matière, sans encre ni impression.
        [À CONFIRMER : délai et coût de fabrication du fer]
    - question: Intervenez-vous hors Île-de-France ?
      answer: >-
        L’atelier intervient à Paris et dans toute l’Île-de-France. Pour un séminaire ailleurs en France, parlons-en :
        les déplacements sont possibles sur demande.
    - question: Quel délai pour réserver ?
      answer: >-
        Le plus tôt est le mieux, surtout pour les périodes de fin d’année et de séminaires de rentrée, et si vous
        souhaitez un marquage à votre logo. Écrivez-nous dès que la date se précise. [À CONFIRMER : délai minimum
        conseillé]

title: Événements et séminaires
order: 1
seo:
  title: Atelier cuir pour séminaires et événements à Paris | Brunette Paris
  description: Bar à ceintures et atelier de personnalisation cuir pour vos séminaires, salons et soirées en Île-de-France. Chaque invité repart avec sa pièce.
card:
  phrase: Bar à ceintures et ateliers de personnalisation, installés au cœur de vos séminaires et de vos soirées.
  photo:
    alt: Ceintures en cuir bleu, brun et noir, boucles assorties
    image: /src/assets/images/offres/evenements-carte-ceintures.jpg
    placeholder: Bar à ceintures en événement, cuirs et boucles présentés sur table (vertical)
hero:
  h1: Ateliers cuir pour vos événements
  accroche: Vos invités repartent avec une pièce qu’ils ont personnalisée eux-mêmes.
  photo:
    alt: Invités personnalisant leur ceinture en cuir
    placeholder: Plein cadre, invités autour de l’atelier nomade pendant une soirée d’entreprise
intro:
  h2: Une animation qui laisse une trace
  paragraph1: >-
    Pour vos séminaires, salons et soirées, Brunette Paris installe un atelier de maroquinerie nomade au cœur
    de votre événement. Armonie arrive avec son établi, ses outils, ses peaux et ses boucles : en quelques
    minutes, un coin de salle devient un véritable atelier. Chaque participant choisit son cuir et sa boucle,
    puis frappe lui-même son prénom ou ses initiales au fer. C’est une animation séminaire qui ne ressemble à
    aucune autre : on y apprend un geste, on y parle matière, et l’on y passe plus de temps qu’on ne l’avait
    prévu.
  paragraph2: >-
    En atelier team building, en petits groupes et sur un temps dédié, ou en animation libre au fil d’un
    cocktail, le format s’adapte à votre nombre d’invités, à votre lieu et à votre déroulé. Chacun repart avec
    un cadeau d’entreprise personnalisé, fabriqué sous ses yeux et un peu de ses mains : une ceinture, un
    porte-clés ou une étiquette de bagage qu’il utilisera longtemps. Pour vos équipes comme pour vos clients,
    c’est un souvenir concret de votre événement, et une façon élégante d’associer votre nom à un savoir-faire
    artisanal d’Île-de-France.
  photo:
    alt: Artisane gravant des initiales sur une ceinture
    placeholder: Vertical, artisane gravant des initiales au poste de marquage
pointsCles:
  title: Ce que nous proposons
  items:
    - title: Bar à ceintures
      text: Vos invités composent leur ceinture, du cuir à la boucle, et la voient prendre forme en direct, à leur taille.
      photo:
        alt: Ceinture en cuir verni noir et boucle argentée
        image: /src/assets/images/offres/evenements-bar-ceintures.jpg
        placeholder: Carré, présentoir de ceintures et boucles
    - title: Porte-clés personnalisés
      text: Une petite pièce rapide à personnaliser, idéale pour les grands groupes, les salons et les lancements.
      photo:
        alt: Porte-clés en cuir colorés et cousus main
        image: /src/assets/images/offres/evenements-porte-cles.jpg
        placeholder: Carré, porte-clés en cuir alignés avec initiales
    - title: Étiquettes de bagage
      text: Un compagnon de voyage utile et durable, marqué au nom de chaque participant. Parfait pour un incentive.
      photo:
        alt: Étiquettes de bagage en cuir
        placeholder: Carré, étiquettes de bagage en cuir avec sangles
    - title: Marquage de prénoms et initiales
      text: Marquage à chaud ou dorure, réalisé sur place, sur la pièce de votre choix ou sur vos propres cadeaux.
      photo:
        alt: Chiffres marqués à chaud dans des médaillons de cuir
        image: /src/assets/images/offres/evenements-marquage.jpg
        placeholder: Carré, gros plan fer à marquer sur cuir
    - title: Atelier découverte du cuir
      text: "Une initiation en petit groupe aux gestes du maroquinier : coupe, couture sellier, finitions. Chacun repart avec l’objet qu’il a cousu."
      photo:
        alt: Atelier découverte du cuir
        placeholder: Carré, participants apprenant la couture main
etapes:
  title: Comment ça se passe
  items:
    - title: Échange sur votre événement
      text: "Date, lieu, nombre d’invités, intentions : nous construisons ensemble le format, et vous recevez un devis détaillé."
    - title: Choix des cuirs et des pièces
      text: Nous vous proposons une sélection de cuirs, de teintes, de boucles et de pièces, aux couleurs de votre événement si vous le souhaitez.
    - title: Installation de l'atelier sur place
      text: Armonie installe son poste de travail avant l’arrivée de vos invités. Une table, une prise, et l’atelier est prêt.
    - title: Vos invités repartent avec leur pièce
      text: Chaque participant emporte une pièce personnalisée, finie à la main, et l’histoire du geste qui va avec.

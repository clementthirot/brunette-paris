hero:
  h1: Le détail qui fait l'expérience
  accroche: Des accessoires en cuir pour les établissements qui soignent chaque geste.
  photo:
    alt: Salle de restaurant avec protège-menus en cuir
    placeholder: Plein cadre, table de restaurant gastronomique avec protège-menu en cuir
intro:
  h2: L'art de recevoir, jusqu'au menu
  paragraph1: >-
    Dans un hôtel, un restaurant ou un club, l’expérience se joue aussi dans ce que l’on touche. Un protège-menu
    en cuir qui tombe juste dans la main, un porte-addition qui se referme avec souplesse, une pochette qui
    accueille la clé d’une chambre : ces objets parlent de votre maison avant même le premier mot. Brunette
    Paris les conçoit sur mesure, au format exact de vos cartes, dans les cuirs et les teintes qui prolongent
    votre décor.
  paragraph2: >-
    Pour les golfs, l’atelier réalise des accessoires de golf en cuir pensés pour durer : protège-clubs,
    portefeuilles et étuis de carte de score, marqués au nom du club ou du parcours, pour votre proshop ou vos
    trophées. Chaque pièce est coupée et cousue à la main en Île-de-France, dans des cuirs choisis pour
    supporter un usage quotidien et se patiner avec élégance. Le nom de votre établissement est frappé à chaud
    ou doré : une signature sobre, qui traverse les saisons sans s’effacer.
  photo:
    alt: Porte-addition en cuir
    placeholder: Vertical, porte-addition en cuir tenu en main par un serveur

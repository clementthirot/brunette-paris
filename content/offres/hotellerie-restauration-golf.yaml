etapes:
  title: Comment ça se passe
  items:
    - title: Brief et intentions
      text: Nous échangeons sur votre établissement, vos usages, vos quantités et vos délais, idéalement sur place.
    - title: Échantillons et prototype
      text: Choix des cuirs, des teintes et des finitions, puis réalisation d’un prototype à tester en salle ou sur le parcours.
    - title: Fabrication
      text: Les pièces sont coupées, cousues et marquées à la main à l’atelier.
    - title: Livraison
      text: Contrôle pièce par pièce, emballage soigné et livraison dans votre établissement.

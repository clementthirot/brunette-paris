faq:
  title: Questions fréquentes
  items:
    - question: Les pièces résistent-elles à un usage quotidien ?
      answer: >-
        Oui, c’est le cahier des charges dès le départ. Nous choisissons des cuirs fermes et résistants, cousons
        au point sellier, qui ne se défait pas, et teintons puis lissons les tranches à la main pour qu’elles restent nettes. Avec
        le temps, le cuir se patine au lieu de s’abîmer.
    - question: Peut-on graver le nom de l'établissement ?
      answer: >-
        Bien sûr : nom, logo ou monogramme, marqués à chaud ou dorés directement dans le cuir, sans encre. Une
        signature sobre qui reste lisible au fil des services.
    - question: Comment entretenir le cuir ?
      answer: >-
        Un chiffon doux et sec au quotidien suffit. Une à deux fois par an, une crème incolore nourrit le cuir.
        Évitez les produits ménagers et la chaleur directe. Nous remettons une fiche d’entretien avec chaque
        commande. [À CONFIRMER : fiche d’entretien remise]
    - question: Pouvez-vous reprendre nos formats et nos couleurs ?
      answer: >-
        Oui. Nous partons de vos cartes, de vos dimensions et de votre décor pour proposer les cuirs, les teintes
        de fil et les finitions qui s’y accordent, et nous validons un prototype avant la fabrication.
    - question: Proposez-vous l’entretien ou le remplacement des pièces ?
      answer: >-
        Les pièces étant fabriquées à l’atelier, nous pouvons réaliser des pièces complémentaires dans un cuir et
        une teinte assortis lorsque votre carte évolue, et vous conseiller pour leur entretien. [À CONFIRMER : offre de
        réassort et de réparation]

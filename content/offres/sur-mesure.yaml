        placeholder: Carré, macro logo marqué dans le cuir
etapes:
  title: Comment ça se passe
  items:
    - title: Brief et intentions
      text: Nous échangeons sur votre marque, vos destinataires, vos quantités, votre budget et vos délais.
    - title: Échantillons et prototype
      text: Vous touchez les cuirs et les finitions, puis nous réalisons un prototype que vous validez avant toute série.
    - title: Fabrication
      text: Les pièces sont coupées, cousues et marquées à la main à l’atelier, une à une.
    - title: Livraison
      text: Contrôle pièce par pièce, emballage soigné et livraison à l’adresse de votre choix.

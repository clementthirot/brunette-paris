    - title: Accessoires pour maisons de luxe
      text: Protège-caméras, étuis, pochettes de présentation… des accessoires discrets et précis, ajustés au millimètre à vos univers.
      photo:
        alt: Protège-caméra en cuir
        placeholder: Carré, protège-caméra en cuir pour maison de luxe
    - title: Couvertures de CD et vinyles
      text: Des éditions spéciales habillées de cuir et signées à la dorure, pour les labels, les artistes et les coffrets collectors.

title: Sur-mesure pour les marques
order: 2
seo:
  title: Maroquinerie sur mesure pour marques et maisons de luxe | Brunette Paris
  description: Cadeaux d’entreprise en cuir personnalisés, accessoires de marque et petites séries sur mesure, cousus main et marqués à chaud par Brunette Paris.
card:
  phrase: Cadeaux d’entreprise et pièces pour maisons de luxe, conçus à quatre mains avec votre marque.
  photo:
    alt: Pièce en cuir marquée au logo d’une marque
    placeholder: Pièce en cuir avec logo marqué à chaud, ambiance studio (vertical)
hero:
  h1: Le cuir à l'image de votre marque
  accroche: Des pièces pensées pour vos équipes, vos clients et vos produits, de la première esquisse à la dernière couture.
  photo:
    alt: Prototypes en cuir sur l’établi
    placeholder: Plein cadre, prototypes et gabarits sur l’établi
intro:
  h2: Du prototype à la petite série
  paragraph1: >-
    Chaque collaboration commence par une conversation. Nous concevons vos pièces à quatre mains avec votre
    équipe : vos valeurs, vos codes, l’usage attendu, puis les cuirs, les teintes et les finitions qui leur
    ressemblent. De ce dialogue naissent des cadeaux d’entreprise en cuir qui ont du sens, des accessoires pour
    vos boutiques ou des pièces qui accompagnent vos propres produits. La maroquinerie sur mesure permet d’aller
    au bout d’une idée, sans les compromis d’un catalogue, et d’offrir un objet que personne d’autre n’aura.
  paragraph2: >-
    Une fois le prototype validé, l’atelier réalise des séries limitées, numérotées si vous le souhaitez,
    toujours cousues à la main. Votre logo est marqué à chaud ou doré, jamais imprimé : une signature discrète
    qui s’inscrit dans la matière et ne s’efface pas. Cette fabrication française, dans un atelier d’Île-de-France,
    vous garantit un interlocuteur unique, un suivi de près à chaque étape et la même exigence de la première
    pièce à la dernière.
  photo:
    alt: Dorure à chaud d’un logo
    placeholder: Vertical, dorure à chaud d’un logo sur cuir

faq:
  title: Questions fréquentes
  items:
    - question: Quelle quantité minimum ?
      answer: >-
        L’atelier travaille aussi bien sur une pièce unique que sur une petite série. Tout étant fait à la main,
        nous privilégions les séries limitées, où chaque pièce garde son caractère. [À CONFIRMER : quantité
        minimum et quantité maximale réalisables]
    - question: Quel délai ?
      answer: >-
        Le délai dépend de la pièce et des quantités : il faut compter le temps du prototype, de sa validation,
        puis de la fabrication. Pour un cadeau de fin d’année, mieux vaut nous contacter dès la rentrée.
        [À CONFIRMER : délais types, prototype et série]
    - question: Peut-on choisir le cuir ?
      answer: >-
        Oui. Nous vous présentons des échantillons de cuirs et de teintes, principalement en vache pleine fleur,
        et selon les projets en python ou en crocodile. Vous choisissez aussi le fil, les tranches et les
        éléments métalliques.
    - question: Comment est marqué le logo ?
      answer: >-
        Par marquage à chaud, en dorure à chaud ou sur un rivet gravé. Le logo s’inscrit dans le cuir, sans
        encre ni impression, ce qui garantit une signature sobre et durable. Un fer est réalisé à partir de votre
        fichier vectoriel. [À CONFIRMER : délai et coût du fer]

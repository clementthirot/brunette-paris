marquages:
  - nom: Marquage à sec
    texte: Le logo est pressé dans le cuir, ton sur ton. Discret et intemporel.
    rendu: sec
    supplementUnitaire: 0
    fraisFixes: 90
  - nom: Dorure or
    texte: Feuille d’or appliquée à chaud. La signature la plus précieuse.
    rendu: or
    supplementUnitaire: 4
    fraisFixes: 90
  - nom: Dorure argent
    texte: Feuille argentée appliquée à chaud, pour un rendu plus froid et graphique.
    rendu: argent
    supplementUnitaire: 4
    fraisFixes: 90
  - nom: Rivet gravé
    texte: Un rivet de laiton gravé à votre logo, fixé dans le cuir.
    rendu: rivet
    supplementUnitaire: 6
    fraisFixes: 60
paliers:
  - aPartirDe: 50
    remise: 8
  - aPartirDe: 100
    remise: 15
  - aPartirDe: 250
    remise: 22
estimation:
  afficher: true
  titre: Estimation indicative
  unitaire: Prix par pièce
  total: Budget total
  fraisFixes: dont frais de cliché
  delai: Délai de fabrication
  semaines: semaines
  mention: >-
    Montants hors taxes, donnés à titre indicatif. Le devis définitif est établi après échange, selon le
    cuir retenu, les finitions et la complexité du logo.
  alerteDelai: >-
    Cette date est très proche du délai de fabrication. Écrivez-nous quand même : selon le planning de
    l’atelier, une solution est souvent possible.
  alerteQuantite: L’atelier réalise cette pièce à partir de {min} exemplaires.

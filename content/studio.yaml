    supplement: 0
  - nom: Cognac
    couleur: '#8a4a24'
    texte: Vachette tannée végétal, ton chaud et profond
    supplement: 0
  - nom: Ébène
    couleur: '#1f1a17'
    texte: Vachette lisse, noir chaud
    supplement: 0
  - nom: Bleu reine

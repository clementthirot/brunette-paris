seo:
  title: Studio cadeaux d’entreprise en cuir, composez et estimez en ligne | Brunette Paris
  description: >-
    Composez votre cadeau d’entreprise en cuir : choisissez la pièce, le cuir, le marquage de votre logo,
    voyez l’aperçu et obtenez une estimation indicative. Fabrication artisanale en Île-de-France.
hero:
  eyebrow: Studio cadeaux · Entreprises
  h1: Composez votre cadeau, voyez votre logo dans le cuir
  accroche: >-
    En cinq étapes, choisissez une pièce, son cuir et sa signature. Déposez votre logo : il se marque à
    chaud sous vos yeux. Vous repartez avec une estimation et un brief prêt à partager en interne.
  start: Commencer
etapes:
  piece: La pièce
  cuir: Le cuir
  marquage: Le marquage
  quantite: Quantité et délai
  brief: Votre brief
  precedent: Précédent
  suivant: Suivant
# TODO : prix, quantités minimum et délais indicatifs à valider avec Armonie avant la mise en ligne.
pieces:
  - nom: Porte-clés
    texte: Le petit objet que l’on garde toute une vie. Idéal pour un séminaire ou une première attention.
    forme: porte-cles
    prixMin: 24
    prixMax: 32
    quantiteMin: 20
    delaiSemaines: 3
    photo:
      alt: Porte-clés en cuir marqué d’un logo
      placeholder: Porte-clés en cuir, fond neutre
  - nom: Porte-cartes
    texte: Fin, cousu main, glissé dans une poche de veste. Le cadeau collaborateur par excellence.
    forme: porte-cartes
    prixMin: 42
    prixMax: 58
    quantiteMin: 15
    delaiSemaines: 4
    photo:
      alt: Porte-cartes en cuir
      placeholder: Porte-cartes en cuir, fond neutre
  - nom: Étiquette de bagage
    texte: Pour les voyageurs, les clients d’un hôtel ou les invités d’un séjour d’entreprise.
    forme: etiquette
    prixMin: 26
    prixMax: 36
    quantiteMin: 20
    delaiSemaines: 3
    photo:
      alt: Étiquette de bagage en cuir
      placeholder: Étiquette de bagage en cuir, fond neutre
  - nom: Portefeuille
    texte: Une pièce de caractère pour remercier un partenaire, un client fidèle ou un dirigeant.
    forme: portefeuille
    prixMin: 110
    prixMax: 150
    quantiteMin: 10
    delaiSemaines: 5
    photo:
      alt: Portefeuille en cuir
      placeholder: Portefeuille en cuir, fond neutre
  - nom: Protège-club de golf
    texte: Pour un trophée, un tournoi d’entreprise ou la boutique d’un golf.
    forme: golf
    prixMin: 75
    prixMax: 98
    quantiteMin: 10
    delaiSemaines: 5
    photo:
      alt: Protège-club de golf en cuir
      placeholder: Protège-club de golf en cuir, fond neutre
  - nom: Trousse de voyage
    texte: Une trousse souple et généreuse, compagne des déplacements de vos équipes.
    forme: trousse
    prixMin: 85
    prixMax: 120
    quantiteMin: 10
    delaiSemaines: 5
    photo:
      alt: Trousse de voyage en cuir
      placeholder: Trousse de voyage en cuir, fond neutre
  - nom: Sous-main ou set de table
    texte: Pour les bureaux d’une direction, les chambres d’un hôtel ou les tables d’un restaurant.
    forme: sous-main
    prixMin: 65
    prixMax: 95
    quantiteMin: 10
    delaiSemaines: 4
    photo:
      alt: Sous-main en cuir
      placeholder: Sous-main en cuir sur un bureau
  - nom: Couverture de vinyle
    texte: Une édition spéciale habillée de cuir, pour un label, un artiste ou un lancement.
    forme: vinyle
    prixMin: 120
    prixMax: 180
    quantiteMin: 10
    delaiSemaines: 6
    photo:
      alt: Couverture de vinyle en cuir
      placeholder: Couverture de vinyle en cuir, fond neutre

recap:
  titre: Votre composition
  logoJoint: >-
    Votre logo reste sur votre appareil pour l’aperçu. L’atelier vous le demandera en haute définition en
    réponse à votre brief.
confirmation: >-
  Merci, votre brief est bien arrivé à l’atelier. Armonie vous répond sous 48 heures avec ses
  premières recommandations et une proposition d’échantillons.
erreur: L’envoi n’a pas abouti. Votre messagerie va s’ouvrir avec le brief déjà rédigé.
messagerie: >-
  Votre messagerie s’ouvre avec le brief déjà rédigé : il ne reste qu’à l’envoyer. Pensez à joindre
  votre logo.
garanties:
  titre: Pourquoi les entreprises choisissent l’atelier
  items:
    - titre: Fait main en Île-de-France
      texte: Chaque pièce est coupée, cousue et marquée à la main à l’atelier, de la première à la dernière.
    - titre: Un prototype avant la série
      texte: Vous validez un prototype réel, dans votre cuir et avec votre logo, avant tout lancement.
    - titre: Une interlocutrice unique
      texte: Vous échangez directement avec l’artisane qui fabrique vos pièces, du brief à la livraison.
    - titre: Une signature durable
      texte: Votre logo est marqué dans la matière, jamais imprimé. Il vieillit avec le cuir, sans s’effacer.
teaser:
  titre: Voyez votre logo marqué dans le cuir
  texte: >-
    Composez votre cadeau d’entreprise en quelques clics : la pièce, le cuir, la dorure. Obtenez une
    estimation immédiate et envoyez un brief prêt à l’emploi.
  bouton: Ouvrir le studio cadeaux

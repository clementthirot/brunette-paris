  entretienText: >-
    Le cuir est une matière vivante : il fonce, se patine et garde la mémoire de vos gestes. Dépoussiérez-le
    avec un chiffon doux et sec, nourrissez-le une à deux fois par an avec une crème incolore adaptée, et
    tenez-le à l’écart des sources de chaleur directe. S’il est mouillé, laissez-le sécher naturellement, loin
    d’un radiateur, puis nourrissez-le. Pour le python et le crocodile, plus délicats, l’atelier vous conseille
    personnellement : écrivez-nous. [À CONFIRMER : conseils d’entretien d’Armonie]

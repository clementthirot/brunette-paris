intro:
  h2: Le cuir rencontre le métal
  text: |-
    Le cuir est souple, chaleureux, vivant. Le métal est dense, froid, durable. Avec Metal Nature, Brunette Paris a choisi de réunir ces deux matières que tout oppose, en associant la maroquinerie à un alliage de métal.

    De cette rencontre naissent des pièces au design unique, où chaque élément métallique trouve sa place dans le cuir avec la même exigence que la couture qui l’entoure.

    [À CONFIRMER : date de la collaboration et histoire de la rencontre entre les deux ateliers.]
objet3d:
  title: Le sac de la collaboration
  text: |-
    Premier fruit de la rencontre entre les deux ateliers, ce sac réunit le cuir de Brunette Paris et le métal façonné par Metal Nature.

    Faites-le tourner pour en découvrir chaque face, la ligne du cuir et la place que le métal y prend.

    [À CONFIRMER : nom du sac, cuir et alliage utilisés, dimensions.]
savoirFaire:
  brunette:
    title: La maroquinerie Brunette Paris
    text: Le choix des peaux, la coupe, l’assemblage et la couture. Le cuir est préparé et travaillé à la main pour accueillir le métal sans perdre sa souplesse.
  artisan:
    title: Le métal de Metal Nature
    text: Metal Nature allie menuiserie et métallerie pour fabriquer des meubles sur mesure à la fois beaux et robustes, au design organique et brut. Pour cette collaboration, son savoir-faire du métal rejoint le cuir.
rencontre:
  title: Rencontre avec l’artisan
  nom: Michel Valade
  role: Menuisier et métallier, fondateur de Metal Nature
  lieu: Sannois, Val-d’Oise
  portrait:
    image: /images/collaborations/michel-valade-metal-nature.webp
    alt: Portrait de Michel Valade, menuisier et métallier, fondateur de Metal Nature
    placeholder: Portrait de Michel Valade dans son atelier
  text: |-
    Autrefois exclusivement menuisier, Michel a enrichi son parcours en devenant également métallier. Dans son atelier de Sannois, il crée des meubles sur mesure qui allient le bois et le métal avec délicatesse et précision.

    Ses pièces, comme la Bibliothèque Pont inspirée des grands ponts suspendus, confient à chaque matériau le rôle qu’il tient le mieux. C’est ce même regard qu’il porte aujourd’hui sur le cuir, aux côtés de Brunette Paris.
chapitres:
  - title: Une fusion de matières
    text: Le métal n’est pas un simple ornement posé sur le cuir. Il fait partie de la pièce, pensé dès le dessin pour s’accorder à ses lignes, à son poids et à son usage.
    photo:
      alt: Détail de l’assemblage du cuir et du métal
      placeholder: Macro de la jonction entre le cuir et l’élément en métal
  - title: Des designs uniques
    text: Chaque pièce de la collaboration est dessinée à quatre mains. Le résultat est singulier, loin des modèles de série, et porte la marque des deux ateliers.
    photo:
      alt: Croquis et prototypes de la collaboration
      placeholder: Croquis, gabarits en carton et éléments en métal posés sur l’établi

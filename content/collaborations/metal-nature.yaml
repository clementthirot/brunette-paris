chapitres:
  - title: Une fusion de matières
    text: Le métal n’est pas un simple ornement posé sur le cuir. Il fait partie de la pièce, pensé dès le dessin pour s’accorder à ses lignes, à son poids et à son usage.
    photo:
      alt: Détail de l’assemblage du cuir et du métal
      placeholder: Macro de la jonction entre le cuir et l’élément en métal
  - title: Des designs uniques
    text: Chaque pièce de la collaboration est dessinée à quatre mains. Le résultat est singulier, loin des modèles de série, et porte la marque des deux ateliers.
    photo:
      alt: Croquis et prototypes de la collaboration
      placeholder: Croquis, gabarits en carton et éléments en métal posés sur l’établi

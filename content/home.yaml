seo:
  title: Brunette Paris — Maroquinerie artisanale sur mesure à Paris
  description: Brunette Paris, maroquinerie artisanale faite main en Île-de-France. Ateliers cuir pour vos séminaires, cadeaux d’entreprise sur mesure et pièces uniques.
hero:
  h1: Maroquinerie artisanale, faite main à Paris
  subtitle: Pièces uniques et ateliers sur mesure pour les entreprises et les particuliers, coupés et cousus à la main par Armonie.
  photo:
    alt: Mains d’Armonie travaillant le cuir à l’établi
    placeholder: Plein cadre, mains travaillant le cuir à l’établi (photo ou vidéo)
entree:
  entreprises:
    title: Pour les entreprises
    text: Un atelier cuir au cœur de vos séminaires, des cadeaux qui portent votre nom, des pièces dessinées pour votre marque ou votre établissement.
    button: Découvrir nos offres
    photo:
      alt: Atelier de personnalisation cuir lors d’un séminaire
      placeholder: Atelier de personnalisation en événement, invités autour du poste de travail
  particuliers:
    title: Pour vous
    text: Des pièces uniques ou en très petites séries, pensées puis cousues à la main, faites pour durer et se patiner.
    button: Voir les créations
    photo:
      alt: Sac en cuir fait main posé sur l’établi
      placeholder: Sac en cuir fini, lumière naturelle, fond d’atelier
manifeste:
  phrase: Chaque pièce porte la trace de la main qui l’a façonnée.
  chiffres:
    - value: 100
      suffix: ' %'
      label: fait main
    - suffix: ''
      label: Atelier en Île-de-France
    - suffix: ''
      label: Pièces uniques & petites séries
offres:
  title: Le cuir au service de votre entreprise
  items:
    - evenements-seminaires
    - sur-mesure
    - hotellerie-restauration-golf
vedette:
  title: Sorties de l’atelier
  pieces:
    - sac-besace-camille
    - ceinture-heritage
    - etui-golf-albatros
    - porte-cles-pivoine
  button: Toutes les créations
savoirFaire:
  title: Du cuir brut à la pièce finie
  etapes:
    - title: Le choix du cuir
      text: Chaque peau est choisie à la main, pour son grain, sa tenue et la manière dont elle vieillira.
      photo:
        alt: Peaux de cuir sélectionnées
        placeholder: Peaux de cuir empilées, main qui en éprouve le grain
    - title: La coupe
      text: Tracée sur gabarit, chaque pièce est découpée au tranchet, en suivant le sens de la peau.
      photo:
        alt: Découpe du cuir au tranchet
        placeholder: Gros plan tranchet découpant le cuir sur gabarit
    - title: La couture main
      text: "Le point sellier : deux aiguilles, un fil ciré, une couture qui tient même si un point cède."
      photo:
        alt: Couture au point sellier
        placeholder: Gros plan mains + couture sellier
    - title: Le marquage
      text: Rivet gravé, dorure ou marquage à chaud signent la pièce, sans aucune couleur imprimée.
      photo:
        alt: Marquage à chaud du logo dans le cuir
        placeholder: Macro marquage à chaud du logo dans le cuir
references:
  label: Ils nous ont fait confiance
